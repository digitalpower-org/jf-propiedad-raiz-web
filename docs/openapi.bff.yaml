openapi: 3.0.3
info:
  title: JF Propiedad Raíz — API pública (navegador ↔ BFF)
  version: 1.0.0
  description: |
    **Contrato PÚBLICO (D26):** del navegador al BFF de Next.js (`packages/client`).

    - El navegador **nunca** llama a Functions directamente: consume datos y acciones solo bajo
      `/api/*` de este contrato, y el BFF reenvía a Functions con `X-Internal-Key` y la
      identidad de la sesión en `X-User-*` (D2, AC0.2.1, US1.3). Ese contrato interno vive en
      `./openapi.backend.yaml` y **no se expone al navegador**.
    - Autenticación: cookie de sesión HttpOnly emitida por el BFF tras canjear el idToken de
      Firebase (US1.2); el BFF valida firma y `exp` de su propio JWT en middleware (US1.3) y no
      usa Firebase Admin (D27).
    - Envoltura de éxito (AC0.1.1) y de error (AC0.1.2) iguales que en la spec interna; catálogo
      de códigos en `components.schemas.ErrorCode` (AC0.1.3). El cliente HTTP centralizado
      convierte `{ success: false, ... }` en `ApiError` (US5.4).
    - Excepción documentada: `POST /api/auth/logout` responde **204 sin cuerpo** (AC1.4.1).
    - Las operaciones que TASKS no define por completo llevan la nota
      `PENDIENTE: definición pendiente en TASKS`.
servers:
  - url: http://localhost:3000
    description: Next.js en desarrollo (BFF integrado en `packages/client`)
  - url: https://jfpropiedadraiz.com
    description: Producción (Firebase App Hosting, D16)
security:
  - session: []
tags:
  - name: auth
    description: 'Ciclo de sesión del BFF: canje de idToken, cierre y sincronización (US1.2, US1.4, US1.6)'
  - name: bff
    description: Superficie pública de proxy al backend (US0.2, AC0.2.1)
  - name: Internal
    description: >-
      Rutas del BFF consumidas **server-to-server** (no por el navegador), autenticadas por
      secreto/`X-Internal-Key`. No forman parte del flujo público del visitante.
paths:
  /api/revalidate:
    post:
      tags: [Internal]
      operationId: revalidate
      summary: Revalidar rutas de Next.js (ISR) tras una escritura
      description: |
        US0.3 / AC0.3.1. **Ruta del BFF (Next.js) invocada server-to-server por Cloud Functions**
        mediante webhook interno autenticado por secreto: solo el BFF puede ejecutar
        `revalidatePath`/`revalidateTag`, y Functions es quien lo *invoca* tras cada escritura.

        El navegador **nunca** llama a esta ruta; el consumidor es Functions (mismo plano interno
        que `X-Internal-Key`, D26). Sin el secreto → 401 (AC0.3.3).

        Tras cada escritura confirmada (inmuebles, servicios, página Nosotros y la tarea de
        «Nuevo» de US1.11), Functions invoca este endpoint con el secreto y se ejecuta
        `revalidatePath`/`revalidateTag` de las rutas afectadas **en ambos idiomas** (listados,
        ficha, portada, servicios, nosotros y sitemap). Si la revalidación falla, la escritura no
        se revierte; solo se registra (AC0.3.4).
      security:
        - X-Internal-Key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'PENDIENTE: definición pendiente en TASKS (AC0.3.1 no especifica el cuerpo; se esperan las rutas/etiquetas afectadas en ambos idiomas).'
              properties:
                paths:
                  type: array
                  items:
                    type: string
                  description: Rutas a revalidar (`revalidatePath`), incluidas sus variantes `/es/...` y `/en/...`.
                tags:
                  type: array
                  items:
                    type: string
                  description: Etiquetas a revalidar (`revalidateTag`).
      responses:
        '200':
          description: 'Revalidación ejecutada (PENDIENTE: definición pendiente en TASKS — cuerpo de respuesta no especificado).'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        description: 'PENDIENTE: definición pendiente en TASKS.'
                        properties:
                          revalidado:
                            type: boolean
        '401':
          description: '401 `UNAUTHORIZED`: `X-Internal-Key` ausente o incorrecto (AC0.3.3).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/auth/session:
    post:
      tags: [auth]
      operationId: createSession
      summary: Canjear el idToken de Firebase por la sesión propia del BFF
      description: |
        US1.2 / AC1.2.1. El front envía el idToken en `Authorization: Bearer` una sola vez; el
        BFF lo reenvía al backend por `POST /internal/auth/verify` con `X-Internal-Key` (D26), y
        solo si el backend confirma identidad y lista blanca (US1.1, AC1.2.3) el BFF responde
        200 y establece una cookie `HttpOnly; Secure; SameSite=Strict; Path=/` con su propio
        JWT `{ sub, email, role, iat, exp }` (exp = 65 min, HS256 con secreto de servidor,
        AC1.2.4). El idToken no se persiste ni queda en la cookie (AC1.2.5, AC1.2.6).

        - idToken inválido/expirado/revocado → 401 `UNAUTHORIZED` sin cookie (AC1.2.2).
        - Fuera de la lista blanca → 403 `PERMISSION_DENIED` sin cookie (AC1.1.1, AC1.1.3).
        - La sesión es stateless; no hay registro de sesiones en el servidor (AC1.2.8, AC1.2.9).
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            pattern: '^Bearer .+$'
          description: 'idToken de Firebase (`Bearer <idToken>`), memoria solo durante el canje (AC1.2.6).'
      responses:
        '200':
          description: >-
            Sesión emitida; la cabecera `Set-Cookie` transporta la cookie HttpOnly de sesión
            (AC1.2.1).
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 'Cookie de sesión: `HttpOnly; Secure; SameSite=Strict; Path=/`, JWT propio, 65 min (AC1.2.1).'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        description: 'PENDIENTE: definición pendiente en TASKS (US1.2 define la cookie, no el cuerpo de la respuesta 200).'
                        properties:
                          role:
                            $ref: '#/components/schemas/Rol'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: deleteSession
      summary: Cerrar la sesión (borrado de cookie en el BFF)
      description: |
        US1.4 / AC1.4.1. Borra la cookie de sesión (`Max-Age=0` con el mismo
        `Path`/`Domain`/`Secure`/`SameSite`) y responde **204 sin cuerpo** (excepción a la
        envoltura AC0.1.1). El logout es bidireccional: el front además ejecuta
        `signOut(auth)` (AC1.4.2); hacer solo `signOut()` dejaría la cookie viva hasta su
        expiración (AC1.4.3, comportamiento prohibido).
      responses:
        '204':
          description: Cookie de sesión borrada; sin cuerpo (AC1.4.1).
        '500':
          description: 'Fallo interno del BFF (sin envoltura: la respuesta no tiene cuerpo en el camino de éxito).'
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getSession
      summary: Confirmar la sesión y devolver la identidad
      description: |
        US1.6 / AC1.6.1. Con cookie válida responde 200 con `{ uid, email, role }` y **sin
        tokens** (AC1.6.4): sin el JWT, sin el idToken ni el refresh token. Permite al front
        sincronizar estado cuando la cookie sigue viva pero la sesión de Firebase se perdió
        (AC1.6.3).
      responses:
        '200':
          description: Identidad de la sesión del BFF.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/bff/{path}:
    get:
      tags: [bff]
      operationId: proxyGet
      summary: Proxy público GET a Functions (lecturas)
      description: |
        US0.2 / AC0.2.1. Superficie genérica `/api/bff/*`: el BFF reenvía la petición a
        Functions con `X-Internal-Key` (AC0.2.2) y, si hay cookie de sesión válida, propaga
        `X-User-Id`/`X-User-Email`/`X-User-Role` con los datos de **su propia sesión**,
        sobrescribiendo cualquier cabecera `X-User-*` del cliente (US1.3, AC1.3.2, AC1.3.5).
        En peticiones públicas reenvía además `X-Client-IP` (AC0.2.5).

        - Rutas privadas sin cookie o con cookie inválida/expirada → 401 `UNAUTHORIZED` sin
          llegar a Functions (AC1.3.1).
        - La respuesta del backend pasa sin transformar, con la misma envoltura (AC0.1.1 /
          AC0.1.2) y el mismo catálogo de códigos (AC0.1.3).

        PENDIENTE: definición pendiente en TASKS. US0.2 / AC0.2.1 solo fijan el prefijo
        `/api/bff/*`; las rutas concretas bajo el prefijo (lecturas públicas del catálogo,
        escrituras del panel, media, consignación) se resuelven en implementación.
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: >-
            Resto del camino bajo `/api/bff/` (p. ej. `properties`, `services`). TASKS no
            enumera rutas concretas; el segmento puede contener barras según el router del BFF.
      responses:
        '200':
          description: Respuesta del backend reenviada sin transformar (envoltura AC0.1.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        description: 'Carga útil de la operación concreta del backend; no se transforma en el BFF.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/EmailDeliveryFailed'
    post:
      tags: [bff]
      operationId: proxyPost
      summary: Proxy público POST a Functions (acciones)
      description: |
        US0.2 / AC0.2.1 y US1.3. Igual que el proxy GET: identidad de la sesión del BFF en
        `X-User-*`, `X-Internal-Key` desde variable de entorno y sin confiar nunca en
        `X-User-*` del navegador (AC1.3.5). En una ruta de escritura, la ausencia de identidad
        hace que el backend responda 401 (AC0.2.4).

        PENDIENTE: definición pendiente en TASKS (rutas concretas bajo `/api/bff/*` no
        enumeradas).
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              description: 'PENDIENTE: definición pendiente en TASKS (cuerpo según la operación concreta del backend).'
      responses:
        '200':
          description: Respuesta del backend reenviada sin transformar (envoltura AC0.1.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        description: 'Carga útil de la operación concreta del backend; no se transforma en el BFF.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/EmailDeliveryFailed'
    put:
      tags: [bff]
      operationId: proxyPut
      summary: Proxy público PUT a Functions
      description: |
        US0.2 / AC0.2.1 y US1.3. Misma propagación de identidad que el proxy POST
        (`X-User-*` de la sesión del BFF, `X-Internal-Key`).

        PENDIENTE: definición pendiente en TASKS (rutas concretas bajo `/api/bff/*` no
        enumeradas).
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              description: 'PENDIENTE: definición pendiente en TASKS (cuerpo según la operación concreta del backend).'
      responses:
        '200':
          description: Respuesta del backend reenviada sin transformar (envoltura AC0.1.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        description: 'Carga útil de la operación concreta del backend; no se transforma en el BFF.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [bff]
      operationId: proxyDelete
      summary: Proxy público DELETE a Functions
      description: |
        US0.2 / AC0.2.1 y US1.3. Misma propagación de identidad que el proxy POST; «eliminar»
        es siempre soft delete confirmado (AC4.1.7).

        PENDIENTE: definición pendiente en TASKS (rutas concretas bajo `/api/bff/*` no
        enumeradas).
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Respuesta del backend reenviada sin transformar (envoltura AC0.1.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        description: 'Carga útil de la operación concreta del backend; no se transforma en el BFF.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: >-
        Cookie HttpOnly con el JWT propio del BFF (US1.2.1): `HttpOnly; Secure;
        SameSite=Strict; Path=/`, firma HS256, expiración 65 min (AC1.2.1, AC1.2.4). El BFF
        valida firma y `exp` en middleware y nunca la lee desde JavaScript (AC1.2.5).
        PENDIENTE: TASKS no fija el nombre literal de la cookie.
    X-Internal-Key:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: >-
        Clave interna servidor↔servidor (US0.2, AC0.2.2) para las rutas del tag `Internal`; la
        exige `POST /api/revalidate`, invocada por Cloud Functions (AC0.3.1, AC0.3.3).
        Comparación en tiempo constante (AC0.2.3); jamás aparece en el cliente ni en logs
        (AC0.2.6).
  responses:
    Unauthorized:
      description: '401 `UNAUTHORIZED`: sin cookie, cookie inválida o expirada (AC1.3.1, AC1.6.2), o idToken inválido/expirado/revocado en el canje de sesión (AC1.2.2).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: '403 `PERMISSION_DENIED`: el backend rechazó a un correo fuera de la lista blanca `authorized_users` en el canje de sesión (AC1.1.1, AC1.1.3) o un rol insuficiente (AC1.12.1). Sin emisión de cookie.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: '404 `PROPERTY_NOT_FOUND` o `SERVICE_NOT_FOUND` reenviado desde el backend (AC1.7.7, AC4.4.4).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: '409 `CONFLICT` reenviado desde el backend por edición concurrente (AC1.7.8, AC4.5.5).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: >-
        422 reenviada desde el backend (AC0.1.4); `code` según la operación: `VALIDATION_ERROR`
        · `CONSENT_REQUIRED` · `UNSUPPORTED_MEDIA` · `IMAGE_TOO_LARGE` · `IMAGE_TOO_SMALL`.
        `details` lista los campos con su mensaje.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: '429 `RATE_LIMITED` reenviada desde el backend (AC3.4.2).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: '500 `INTERNAL`; la respuesta incluye su `requestId` (AC0.1.2).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    EmailDeliveryFailed:
      description: '502 `EMAIL_DELIVERY_FAILED` reenviada desde el backend (AC3.2.4); el formulario activa el respaldo de US3.1 (AC3.1.5).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiSuccess:
      type: object
      description: 'Envoltura de éxito (AC0.1.1): `{ success: true, data, message }`. El esquema concreto de `data` se añade en cada operación mediante `allOf`.'
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [true]
          description: Siempre `true`.
        message:
          type: string
          description: Mensaje legible para quien consuma la API.
    ApiError:
      type: object
      description: 'Envoltura de error (AC0.1.2): `{ success: false, data: { code, details, requestId }, message }`. El cliente la convierte en `ApiError` (US5.4.1).'
      required: [success, data, message]
      properties:
        success:
          type: boolean
          enum: [false]
          description: Siempre `false`.
        message:
          type: string
          description: 'Mensaje en español; nunca expone trazas, rutas internas ni datos personales (AC0.1.5). El cliente jamás lo muestra tal cual: traduce el `code` (AC5.4.2).'
        data:
          type: object
          required: [code, requestId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            requestId:
              type: string
              description: >-
                Identificador del error también registrado en logs (AC0.1.2); en el admin se
                muestra con botón de copiado (AC5.4.4) y en el público solo como «código de
                referencia» discreto en fallos graves (AC5.4.5).
            details:
              description: 'Detalle según el `code`; en `VALIDATION_ERROR` lista los campos con su mensaje (AC0.1.4).'
    ErrorCode:
      type: string
      description: |
        Catálogo único de códigos de error y su estado HTTP (AC0.1.3) — misma tabla que
        `shared-types/src/errors.d.ts`:

        | code | HTTP |
        | --- | --- |
        | `VALIDATION_ERROR` | 422 |
        | `CONSENT_REQUIRED` | 422 |
        | `UNSUPPORTED_MEDIA` | 422 |
        | `IMAGE_TOO_LARGE` | 422 |
        | `IMAGE_TOO_SMALL` | 422 |
        | `UNAUTHORIZED` | 401 |
        | `PERMISSION_DENIED` | 403 |
        | `PROPERTY_NOT_FOUND` | 404 |
        | `SERVICE_NOT_FOUND` | 404 |
        | `CONFLICT` | 409 |
        | `RATE_LIMITED` | 429 |
        | `EMAIL_DELIVERY_FAILED` | 502 |
        | `INTERNAL` | 500 |
      enum:
        - VALIDATION_ERROR
        - CONSENT_REQUIRED
        - UNSUPPORTED_MEDIA
        - IMAGE_TOO_LARGE
        - IMAGE_TOO_SMALL
        - UNAUTHORIZED
        - PERMISSION_DENIED
        - PROPERTY_NOT_FOUND
        - SERVICE_NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - EMAIL_DELIVERY_FAILED
        - INTERNAL
    Rol:
      type: string
      description: 'Rol de la sesión del BFF, resuelto por el backend desde `authorized_users` (AC1.2.7); en la v1 su valor es siempre `admin` (AC1.5.6).'
      enum: [admin]
    SessionIdentity:
      type: object
      description: 'Identidad de la sesión del BFF (AC1.6.1). [Debe NOT] no incluye el JWT, el idToken ni el refresh token (AC1.6.4).'
      required: [uid, email, role]
      properties:
        uid:
          type: string
          description: UID de Firebase Auth del que provino la sesión.
        email:
          type: string
        role:
          $ref: '#/components/schemas/Rol'
