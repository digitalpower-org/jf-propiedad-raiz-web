        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    X-Internal-Key:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: |
        Clave interna servidor↔servidor (US0.2, AC0.2.2) leída en variable de entorno del BFF.
        Comparación en tiempo constante (AC0.2.3); jamás aparece en el cliente ni en logs
        (AC0.2.6). Toda operación de esta spec la exige.
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
      description: 'UID de la sesión del BFF, propagado al backend (AC1.3.2). El BFF siempre lo sobrescribe con su propia sesión (AC1.3.5).'
    XUserEmail:
      name: X-User-Email
      in: header
      required: false
      schema:
        type: string
      description: Email de la sesión del BFF (AC1.3.2).
    XUserRole:
      name: X-User-Role
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Rol'
      description: 'Rol de la sesión; el backend autoriza las rutas de administrador con este valor (AC1.3.3, D27). Ausente en una ruta de escritura → 401 (AC0.2.4).'
    XClientIP:
      name: X-Client-IP
      in: header
      required: true
      schema:
        type: string
      description: 'IP del visitante reenviada por el BFF en peticiones públicas; solo se acepta con clave interna válida y alimenta el límite de envíos (AC0.2.5, US3.4).'
  responses:
    Unauthorized:
      description: '401 `UNAUTHORIZED`: falta o falla `X-Internal-Key` (AC0.2.3), falta la identidad en una ruta de escritura (AC0.2.4), idToken inválido/expirado/revocado (AC1.2.2) o sesión sin cookie válida (AC1.3.1, AC1.6.2).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: '403 `PERMISSION_DENIED`: fuera de la lista blanca `authorized_users` (AC1.1.1, AC1.1.3) o rol insuficiente (AC1.12.1).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: '404 `PROPERTY_NOT_FOUND` o `SERVICE_NOT_FOUND`: recurso inexistente, `HIDDEN` o `DELETED` según recurso (AC1.7.7, AC4.4.4).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: '409 `CONFLICT`: `updatedAt` desactualizado por edición concurrente (AC1.7.8, AC4.5.5).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: >-
        422 con `code` según la operación (AC0.1.4): `VALIDATION_ERROR` (validación de contrato o
        de negocio) · `CONSENT_REQUIRED` (consentimiento ausente o falso) · `UNSUPPORTED_MEDIA`
        (tipo de contenido no permitido) · `IMAGE_TOO_LARGE` (peso o píxeles excedidos) ·
        `IMAGE_TOO_SMALL` (lado mayor < 800 px). `details` lista los campos con su mensaje.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: '429 `RATE_LIMITED`: más de 5 envíos en un minuto desde la misma IP (AC3.4.2).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: '500 `INTERNAL`: fallo interno; la respuesta incluye su `requestId` (AC1.9.14, AC0.1.2).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    EmailDeliveryFailed:
      description: '502 `EMAIL_DELIVERY_FAILED`: falló el correo a Juan Fernando; no se envía el recibo (AC3.2.4).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiSuccess:
      type: object
      description: 'Envoltura de éxito (AC0.1.1): `{ success: true, data, message }`. El esquema concreto de `data` se añade en cada operación mediante `allOf`.'
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [true]
          description: Siempre `true`.
        message:
          type: string
          description: Mensaje legible para quien consuma la API.
    ApiError:
      type: object
      description: 'Envoltura de error (AC0.1.2): `{ success: false, data: { code, details, requestId }, message }`. El `requestId` también se registra en logs.'
      required: [success, data, message]
      properties:
        success:
          type: boolean
          enum: [false]
          description: Siempre `false`.
        message:
          type: string
          description: 'Mensaje en español; nunca expone trazas, rutas internas ni datos personales (AC0.1.5).'
        data:
          type: object
          required: [code, requestId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            requestId:
              type: string
              description: Identificador del error también registrado en logs (AC0.1.2).
            details:
              description: 'Detalle según el `code`; en `VALIDATION_ERROR` lista los campos con su mensaje (AC0.1.4).'
    ErrorCode:
      type: string
      description: |
        Catálogo único de códigos de error y su estado HTTP (AC0.1.3) — misma tabla que
        `shared-types/src/errors.d.ts`:

        | code | HTTP |
        | --- | --- |
        | `VALIDATION_ERROR` | 422 |
        | `CONSENT_REQUIRED` | 422 |
        | `UNSUPPORTED_MEDIA` | 422 |
        | `IMAGE_TOO_LARGE` | 422 |
        | `IMAGE_TOO_SMALL` | 422 |
        | `UNAUTHORIZED` | 401 |
        | `PERMISSION_DENIED` | 403 |
        | `PROPERTY_NOT_FOUND` | 404 |
        | `SERVICE_NOT_FOUND` | 404 |
        | `CONFLICT` | 409 |
        | `RATE_LIMITED` | 429 |
        | `EMAIL_DELIVERY_FAILED` | 502 |
        | `INTERNAL` | 500 |
      enum:
        - VALIDATION_ERROR
        - CONSENT_REQUIRED
        - UNSUPPORTED_MEDIA
        - IMAGE_TOO_LARGE
        - IMAGE_TOO_SMALL
        - UNAUTHORIZED
        - PERMISSION_DENIED
        - PROPERTY_NOT_FOUND
        - SERVICE_NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - EMAIL_DELIVERY_FAILED
        - INTERNAL
    EstadoPropiedad:
      type: string
      description: 'Estados de inmuebles y servicios (D7). Sin `DRAFT` ni estados de disponibilidad.'
      enum: [ACTIVE, HIDDEN, DELETED]
    Operacion:
      type: string
      description: 'Operación de la pestaña (D8, D20). `PROYECTO_SOBRE_PLANOS` tiene campos propios (`proyecto`).'
      enum: [VENTA, ALQUILER, PROYECTO_SOBRE_PLANOS]
    TipoInmueble:
      type: string
      description: Catálogo cerrado de tipo de inmueble (MODELO DE DATOS, TASKS).
      enum:
        - CASA
        - APARTAMENTO
        - LOTE_CAMPESTRE
        - LOTE_URBANO
        - FINCA
        - LOCAL_COMERCIAL
        - BODEGA
        - OFICINA
    Rol:
      type: string
      description: 'Rol de la sesión resuelto por el backend desde `authorized_users` (AC1.2.7); en la v1 su valor es siempre `admin`.'
      enum: [admin]
    Translatable:
      type: object
      description: 'Campo traducible (MODELO DE DATOS, TASKS). `es` lo escribe el admin; `en` lo escribe el sistema con traducción automática o el admin a mano (US0.5).'
      required: [es]
      properties:
        es:
          type: string
          description: Texto en español (idioma por defecto, D22).
        en:
          type: string
          description: Texto en inglés; vacío o ausente = traducción pendiente (AC0.4.5).
        autoTranslate:
          type: boolean
          description: 'Solo lo escribe el backend; el admin no lo envía en el DTO (AC0.5.10).'
        enPendiente:
          type: boolean
          description: 'Solo lo escribe el backend (regla de estado de AC0.5.11); el admin no lo envía en el DTO (AC0.5.10).'
    TranslatableInput:
      type: object
      description: 'DTO de entrada de un campo traducible: el admin escribe `es` y puede editar `en` (AC0.5.4); `autoTranslate` y `enPendiente` no se envían (AC0.5.10).'
      required: [es]
      properties:
        es:
          type: string
        en:
          type: string
    Identity:
      type: object
      description: 'Identidad verificada por el backend para que el BFF emita su cookie (US1.2, D27).'
      required: [uid, email, role]
      properties:
        uid:
          type: string
          description: UID de Firebase Auth del idToken verificado.
        email:
          type: string
          description: 'Correo verificado; debe constar en `authorized_users` con `active = true` (US1.1).'
        role:
          $ref: '#/components/schemas/Rol'
    PropertyCard:
      type: object
      description: >-
        Tarjeta de listado (AC7.4.1): `Property` sin `descripcion`, sin `puntosInteres` y sin la
        lista completa de fotos. Fuente TS: `shared-types/src/models` (`PropertyCard`).
      required: [id, codigo, slug, operacion, tipo, titulo, precio, departamento, municipio, destacada, nuevo, createdAt]
      properties:
        id:
          type: string
        codigo:
          type: string
          description: 'Código secuencial `JF-XXXX` (D6, AC2.2.11).'
        slug:
          type: string
        operacion:
          $ref: '#/components/schemas/Operacion'
        tipo:
          $ref: '#/components/schemas/TipoInmueble'
        titulo:
          $ref: '#/components/schemas/Translatable'
        precio:
          type: integer
          description: 'COP entero, sin decimales (D22, AC0.4.8).'
        departamento:
          type: string
        municipio:
          type: string
        dormitorios:
          type: integer
        banos:
          type: integer
        areaConstruida:
          type: number
        estrato:
          type: integer
        destacada:
          type: boolean
        nuevo:
          type: boolean
          description: 'Bandera automática (D18); insignia «Nuevo» en la tarjeta (AC2.2.11).'
        createdAt:
          type: string
          format: date-time
        portada:
          type: object
          description: Derivados WebP de la foto en posición 1, indexados por lado mayor en px (US1.9).
          properties:
            clavesPorAncho:
              type: object
              additionalProperties:
                type: string
              example:
                '320': propiedades/JF-0001/portada-320.webp
                '640': propiedades/JF-0001/portada-640.webp
    PropertyListData:
      type: object
      description: 'Página del listado público (AC1.10.1): `{ items, nextCursor }`, solo `ACTIVE`, `createdAt` desc con desempate por `id` (D17).'
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropertyCard'
        nextCursor:
          type: string
          nullable: true
          description: 'Cursor `{ createdAt, id }` de la siguiente página; `null` al final (AC1.10.2).'
    PropertyDetail:
      type: object
      description: >-
        PENDIENTE: definición pendiente en TASKS. Ficha completa del inmueble (US2.4): los
        campos del modelo `Property` de `shared-types/src/models`; TASKS no desglosa el DTO de
        respuesta de esta operación.
      additionalProperties: true
      properties:
        id:
          type: string
        codigo:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/EstadoPropiedad'
    PropertyInput:
      type: object
      description: >-
        DTO de escritura del editor de inmuebles (AC4.1.3). Excluye los campos de solo lectura
        `codigo`, `nuevo`, `fechaPublicacion`, `createdAt` y `updatedAt` (AC1.7.2), y los campos
        que solo escribe el backend `autoTranslate`/`enPendiente` (AC0.5.10).
      required: [operacion, tipo, titulo, precio, departamento, municipio]
      properties:
        operacion:
          $ref: '#/components/schemas/Operacion'
        tipo:
          $ref: '#/components/schemas/TipoInmueble'
        titulo:
          $ref: '#/components/schemas/TranslatableInput'
        descripcion:
          $ref: '#/components/schemas/TranslatableInput'
        precio:
          type: integer
          minimum: 1
          description: 'COP entero > 0 (AC1.7.4); valor de venta o canon mensual.'
        departamento:
          type: string
        municipio:
          type: string
        estrato:
          type: integer
        predial:
          type: string
        administracion:
          type: string
        acabados:
          $ref: '#/components/schemas/TranslatableInput'
        antiguedad:
          type: string
        areaConstruida:
          type: number
        areaLote:
          type: number
        dormitorios:
          type: integer
        banos:
          type: integer
        parqueaderos:
          type: integer
        deposito:
          type: integer
          description: Cuarto útil.
        amenidades:
          type: array
          description: 'Catálogo cerrado definido en `shared-types` (p. ej. `PISCINA`, `CANCHA`, `GIMNASIO`).'
          items:
            type: string
        puntosInteres:
          type: array
          description: Categoría predefinida o ítem personalizado con etiqueta traducible.
          items:
            type: object
            required: [etiqueta]
            properties:
              categoria:
                type: string
                description: 'Categoría predefinida (educación, gimnasio, zona comercial, avenida principal, transporte público, salud — AC2.4.4); ausente = ítem personalizado.'
              etiqueta:
                $ref: '#/components/schemas/TranslatableInput'
        fotos:
          type: array
          description: 'Orden = posición; posición 1 = portada (US4.2.1). Cada foto conserva las claves de sus derivados (MODELO DE DATOS).'
          items:
            type: object
            required: [derivados]
            properties:
              derivados:
                type: array
                items:
                  type: object
                  required: [clave, ancho]
                  properties:
                    clave:
                      type: string
                    ancho:
                      type: integer
        videos:
          type: array
          maxItems: 2
          description: 'Máx. 2 URLs de YouTube (MODELO DE DATOS, D13).'
          items:
            type: string
        panoramas:
          type: array
          maxItems: 3
          description: 'Máx. 3 panorámicas JPG (D21, US4.3.3).'
          items:
            type: object
            required: [derivados]
            properties:
              derivados:
                type: array
                items:
                  type: object
                  required: [clave, ancho]
                  properties:
                    clave:
                      type: string
                    ancho:
                      type: integer
        destacada:
          type: boolean
        status:
          $ref: '#/components/schemas/EstadoPropiedad'
        proyecto:
          type: object
          description: 'Solo si `operacion = PROYECTO_SOBRE_PLANOS` (D20, AC4.1.5).'
          required: [etapa]
          properties:
            etapa:
              $ref: '#/components/schemas/TranslatableInput'
            fechaEntregaEstimada:
              type: string
              pattern: '^\d{4}-\d{2}$'
              description: Mes y año de entrega en formato `AAAA-MM`.
            unidadesDisponibles:
              type: integer
        updatedAt:
          type: string
          format: date-time
          description: 'Control de concurrencia optimista en la actualización: desactualizado → 409 `CONFLICT` (AC1.7.8).'
    ConsignmentInput:
      type: object
      description: >-
        Solicitud «Consigne su propiedad» (US3.1). Obligatorios: nombre, teléfono, email, tipo,
        ubicación y consentimiento (SUPUESTO 9); el resto es opcional. No se persiste (D11).
      required: [nombre, telefono, email, tipo, departamento, municipio, consent]
      properties:
        nombre:
          type: string
        telefono:
          type: string
          description: 'Normalizado a formato internacional; 10 dígitos que empiezan por 3 se asumen `+57` (AC3.1.3).'
        email:
          type: string
          format: email
        tipo:
          $ref: '#/components/schemas/TipoInmueble'
        departamento:
          type: string
        municipio:
          type: string
        valor:
          type: integer
          description: Valor solicitado por el dueño (opcional).
        areaConstruida:
          type: number
        areaLote:
          type: number
        mensaje:
          type: string
        consent:
          type: boolean
          description: 'Consentimiento obligatorio y nunca premarcado (AC3.3.1); falso o ausente → 422 `CONSENT_REQUIRED` (AC3.3.2).'
        sitio:
          type: string
          description: 'Campo oculto (honeypot): con valor, la respuesta es de éxito pero no se envía ningún correo (AC3.4.1).'
        idioma:
          type: string
          enum: [es, en]
          description: 'Idioma del solicitante incluido en los correos (AC3.2.1, AC3.2.3).'
    ServiceCard:
      type: object
      description: 'Tarjeta de servicio para el índice público (AC5.1.1). Fuente TS: `shared-types/src/models` (`Service`).'
      required: [id, slug, titulo, orden]
      properties:
        id:
          type: string
        slug:
          type: string
        titulo:
          $ref: '#/components/schemas/Translatable'
        resumen:
          $ref: '#/components/schemas/Translatable'
        orden:
          type: integer
          description: Define el orden público (AC4.4.3).
        portada:
          type: object
          description: Derivados WebP de la foto de portada, indexados por lado mayor en px.
          properties:
            clavesPorAncho:
              type: object
              additionalProperties:
                type: string
    ServiceDetail:
      type: object
      description: >-
        PENDIENTE: definición pendiente en TASKS. Detalle del servicio (US5.1.2); los campos
        del modelo `Service` de `shared-types/src/models`.
      additionalProperties: true
      properties:
        id:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/EstadoPropiedad'
    ServiceInput:
      type: object
      description: >-
        DTO de escritura de servicios (US4.4): título, resumen, cuerpo y fotos son traducibles
        (T1, AC4.4.7); `cuerpo` es texto plano con párrafos, sin HTML (AC4.5.7).
      required: [titulo, resumen, cuerpo]
      properties:
        titulo:
          $ref: '#/components/schemas/TranslatableInput'
        resumen:
          $ref: '#/components/schemas/TranslatableInput'
        cuerpo:
          $ref: '#/components/schemas/TranslatableInput'
        fotos:
          type: array
          description: Misma galería que las fotos de inmuebles (portada, orden, derivados — AC4.4.6).
          items:
            type: object
            required: [derivados]
            properties:
              derivados:
                type: array
                items:
                  type: object
                  required: [clave, ancho]
                  properties:
                    clave:
                      type: string
                    ancho:
                      type: integer
        status:
          $ref: '#/components/schemas/EstadoPropiedad'
        orden:
          type: integer
        updatedAt:
          type: string
          format: date-time
          description: 'Control de concurrencia optimista (patrón AC1.7.8 / AC4.5.5) → 409 `CONFLICT`.'
    AboutInput:
      type: object
      description: >-
        Documento único `pages/nosotros` (D25, US4.5). El `extracto` tiene máximo 500
        caracteres (AC4.5.3); el orden de `secciones` y `equipo` es la posición del arreglo
        (MODELO DE DATOS, TASKS).
      required: [titulo, extracto, secciones, equipo]
      properties:
        titulo:
          $ref: '#/components/schemas/TranslatableInput'
        extracto:
          type: string
          maxLength: 500
          description: Extracto mostrado en la portada (AC2.6.4); > 500 → 422 `VALIDATION_ERROR` (AC4.5.3).
        secciones:
          type: array
          description: Secciones libres (visión, misión, historia…); orden = posición (US4.5.1).
          items:
            type: object
            required: [id, titulo, cuerpo]
            properties:
              id:
                type: string
              titulo:
                $ref: '#/components/schemas/TranslatableInput'
              cuerpo:
                $ref: '#/components/schemas/TranslatableInput'
        equipo:
          type: array
          description: Integrantes del equipo; orden = posición (US4.5.1).
          items:
            type: object
            required: [id, nombre, cargo]
            properties:
              id:
                type: string
              nombre:
                type: string
                description: 'No se traduce (US0.5, «No se traducen»).'
              cargo:
                $ref: '#/components/schemas/TranslatableInput'
              descripcion:
                $ref: '#/components/schemas/TranslatableInput'
              foto:
                type: string
                description: 'Clave de R2 de la foto con sus derivados (US4.5.2); una sola por integrante.'
        updatedAt:
          type: string
          format: date-time
          description: 'Control de concurrencia optimista (AC4.5.5) → 409 `CONFLICT`.'
