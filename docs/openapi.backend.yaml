openapi: 3.0.3
info:
  title: JF Propiedad Raíz — API interna (BFF ↔ Functions)
  version: 1.0.0
  description: |
    **Contrato INTERNO (D26):** del BFF de Next.js (`packages/client`) a Functions de Firebase
    (`packages/functions`).

    - Toda llamada lleva la cabecera `X-Internal-Key` (AC0.2.2); sin ella o con valor incorrecto
      responde 401 `UNAUTHORIZED` con comparación en tiempo constante (AC0.2.3).
    - Las rutas de escritura exigen además la identidad de la sesión del BFF propagada en
      `X-User-Id` / `X-User-Role` (US1.3, AC0.2.4); el backend autoriza con `X-User-Role: admin`
      (D27) y el BFF siempre sobrescribe esas cabeceras con su propia sesión (AC1.3.5).
    - `X-Client-IP` se reenvía solo en peticiones públicas y se acepta únicamente con clave
      interna válida (AC0.2.5; límite de envíos de US3.4).
    - Este contrato **no se expone al navegador** (D26). El navegador solo habla con el BFF:
      ver `./openapi.bff.yaml`.
    - Envoltura de éxito (AC0.1.1) y de error (AC0.1.2) iguales que en la spec pública; el
      catálogo de códigos de error (AC0.1.3) vive en `components.schemas.ErrorCode`.
    - Las operaciones que TASKS no define por completo llevan la nota
      `PENDIENTE: definición pendiente en TASKS`.
servers:
  - url: http://127.0.0.1:5001/jf-propiedad-raiz/us-central1
    description: Emulador de Cloud Functions (proyecto `jf-propiedad-raiz`, región `us-central1`)
security:
  - X-Internal-Key: []
tags:
  - name: auth
    description: Verificación interna de idToken y lista blanca (US1.1, US1.2, D27)
  - name: properties
    description: Consulta pública del catálogo y ciclo de vida de admin de inmuebles (US1.7, US1.10, US4.1)
  - name: media
    description: URLs presignadas de Cloudflare R2 y confirmación de subida (US1.8, US1.9)
  - name: consignments
    description: Solicitudes «Consigne su propiedad» por correo (US3.1–US3.4)
  - name: services
    description: CRUD de servicios (US4.4)
  - name: about
    description: Página Nosotros, documento único `pages/nosotros` (US4.5, D25)
paths:
  /internal/auth/verify:
    post:
      tags: [auth]
      operationId: verifyIdToken
      summary: Verificación interna de idToken de Firebase
      description: |
        US1.2 / AC1.2.3 (D26, D27). El BFF recibe el idToken del navegador una sola vez y lo
        reenvía aquí con `X-Internal-Key`; el backend lo verifica con Firebase Admin
        (`verifyIdToken(idToken, true)`), comprueba que el `email` esté en `authorized_users`
        con `active = true` (US1.1) y devuelve la identidad y el rol para que el BFF emita su
        cookie de sesión (AC1.2.1). El backend es quien lee la lista blanca (AC1.2.9).
      security:
        - X-Internal-Key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: ID token de Firebase emitido por Google Sign-In (memoria solo durante el canje, AC1.2.6).
      responses:
        '200':
          description: Identidad verificada y autorizada por la lista blanca.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/properties:
    get:
      tags: [properties]
      operationId: listProperties
      summary: Listado público de inmuebles con filtros y paginación por cursor
      description: |
        US1.10 / AC1.10.1. Devuelve solo inmuebles `ACTIVE`, ordenados por `createdAt`
        descendente con desempate por `id`, paginados por cursor `{ createdAt, id }` (D17, D19).
        `destacada` se envía siempre con un único valor (`true` o `false`, nunca ambos, D28):
        la portada pide `true` y las pestañas hacen dos consultas, primero `true` y después
        `false` (AC2.3.1). `departamento` y `municipio` van juntos o no se envían (D24).
        Una combinación fuera de los 8 presets responde 422 `VALIDATION_ERROR` (AC1.10.5).
      parameters:
        - name: operacion
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Operacion'
          description: Operación fija de la pestaña (D8, D28).
        - name: destacada
          in: query
          required: true
          schema:
            type: boolean
          description: Un único valor `true` o `false`, nunca ambos (D28, AC1.10.1).
        - name: tipo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TipoInmueble'
          description: Igualdad opcional de preset 3 (D28).
        - name: departamento
          in: query
          required: false
          schema:
            type: string
          description: 'Junto con `municipio` (preset 4); juntos o ninguno (D24, AC1.10.1).'
        - name: municipio
          in: query
          required: false
          schema:
            type: string
          description: 'Junto con `departamento` (preset 4); juntos o ninguno (D24, AC1.10.1).'
        - name: precioMin
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: 'Rango de precio COP (preset 2); `precioMin` ≤ `precioMax`, si no 422 (AC1.10.3).'
        - name: precioMax
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: 'Rango de precio COP (preset 2); `precioMin` ≤ `precioMax`, si no 422 (AC1.10.3).'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Cursor opaque `{ createdAt, id }` de la serie (D17, AC1.10.2); solo aplica dentro de su propia serie.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 50
          description: 'Tamaño de página: 12 por defecto, máx. 50 (AC1.10.1, D19).'
      responses:
        '200':
          description: Página de tarjetas con cursor siguiente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/PropertyListData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [properties]
      operationId: createProperty
      summary: Crear un inmueble (estado inicial HIDDEN)
      description: |
        PENDIENTE: definición pendiente en TASKS. Ruta deducida de US1.7 / AC1.7.1 y US4.1 /
        AC4.1.2 (crear → `HIDDEN` con `codigo` `JF-XXXX` secuencial, `nuevo = true` y
        `createdAt`, D6); TASKS define el caso de uso pero no la ruta HTTP ni el cuerpo exacto
        de la respuesta. `codigo`, `nuevo`, `fechaPublicacion`, `createdAt` y `updatedAt` son de
        solo lectura y no se envían (AC1.7.2); `autoTranslate` y `enPendiente` solo los escribe el
        backend (AC0.5.10).
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '201':
          description: 'Inmueble creado en `HIDDEN` con su `codigo` asignado (AC1.7.1, AC4.1.2).'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        description: 'PENDIENTE: definición pendiente en TASKS (cuerpo de la respuesta de creación no especificado).'
                        properties:
                          id:
                            type: string
                          codigo:
                            type: string
                            description: 'Código secuencial `JF-XXXX` (D6).'
                          slug:
                            type: string
                          status:
                            $ref: '#/components/schemas/EstadoPropiedad'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/properties/featured:
    get:
      tags: [properties]
      operationId: getFeaturedProperties
      summary: Destacadas de la portada
      description: |
        US1.10 / AC1.10.6. Devuelve hasta 12 inmuebles `ACTIVE` con `destacada = true`,
        ordenados por `fechaPublicacion` descendente (consulta propia con su índice, §5 de
        ARCHITECTURE). No admite parámetros de filtro.
      responses:
        '200':
          description: Hasta 12 tarjetas de portada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 12
                            items:
                              $ref: '#/components/schemas/PropertyCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/properties/{idOrSlug}:
    get:
      tags: [properties]
      operationId: getProperty
      summary: Detalle de un inmueble por id o slug
      description: |
        PENDIENTE: definición pendiente en TASKS. Deducido de AC1.7.7 (una ficha `HIDDEN` o
        `DELETED` solicitada por `:idOrSlug` desde la web pública responde 404
        `PROPERTY_NOT_FOUND`) y de US2.4 (la ficha se renderiza con estos datos); TASKS no
        fija la ruta HTTP ni el DTO completo de respuesta.
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema:
            type: string
          description: 'Id del documento o `slug` (AC1.7.7).'
      responses:
        '200':
          description: Ficha completa del inmueble.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/PropertyDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [properties]
      operationId: updateProperty
      summary: Actualizar un inmueble (edición del admin)
      description: |
        PENDIENTE: definición pendiente en TASKS. Ruta deducida de US4.1 (editor del panel) y
        US1.7; TASKS define el comportamiento pero no la ruta HTTP. Optimismo por concurrencia:
        si el `updatedAt` enviado está desactualizado responde 409 `CONFLICT` (AC1.7.8). Al
        guardar se traducen los campos con `autoTranslate` activo (US0.5) y se dispara la
        revalidación (US0.3). Al guardar completo pasa automáticamente a `ACTIVE` (AC4.1.6).
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '200':
          description: 'Inmueble actualizado (PENDIENTE: definición pendiente en TASKS — cuerpo de respuesta no especificado).'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        description: 'PENDIENTE: definición pendiente en TASKS.'
                        properties:
                          id:
                            type: string
                          status:
                            $ref: '#/components/schemas/EstadoPropiedad'
                          updatedAt:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [properties]
      operationId: deleteProperty
      summary: Eliminar un inmueble (soft delete)
      description: |
        PENDIENTE: definición pendiente en TASKS. Ruta deducida de US1.7 (soft delete a
        `DELETED`) y US4.1 / AC4.1.7 («eliminar» pide confirmación y retira el inmueble del
        sitio público); TASKS no fija la ruta HTTP. Tras la escritura se revalida (US0.3).
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserEmail'
      responses:
        '200':
          description: 'Soft delete confirmado (PENDIENTE: definición pendiente en TASKS — cuerpo de respuesta no especificado).'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        description: 'PENDIENTE: definición pendiente en TASKS.'
                        properties:
                          id:
                            type: string
                          status:
                            $ref: '#/components/schemas/EstadoPropiedad'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/properties/{idOrSlug}/activate:
    post:
      tags: [properties]
      operationId: activateProperty
      summary: Activar un inmueble (HIDDEN → ACTIVE)
      description: |
        PENDIENTE: definición pendiente en TASKS (US1.7 / US4.1 definen la operación «activar»,
        no la ruta HTTP). Validación de activación: si faltan `operacion`, `tipo`, `titulo` (es),
        `departamento`, `municipio`, `precio` o al menos una foto responde 422
        `VALIDATION_ERROR` con los campos faltantes (AC1.7.3); `precio` debe ser entero > 0
        (AC1.7.4). La primera activación fija `fechaPublicacion` (AC1.7.5) y dispara
        revalidación (US0.3).
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserEmail'
      responses:
        '200':
          description: 'Inmueble activado (PENDIENTE: definición pendiente en TASKS — cuerpo de respuesta no especificado).'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        description: 'PENDIENTE: definición pendiente en TASKS.'
                        properties:
                          id:
                            type: string
                          status:
                            $ref: '#/components/schemas/EstadoPropiedad'
                          fechaPublicacion:
                            type: string
                            format: date-time
                            description: 'Se fija solo en la primera activación (AC1.7.5).'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/properties/{idOrSlug}/hide:
    post:
      tags: [properties]
      operationId: hideProperty
      summary: Ocultar un inmueble (ACTIVE → HIDDEN)
      description: |
        PENDIENTE: definición pendiente en TASKS (US1.7 / US4.1 / AC4.1.7 definen «ocultar»,
        no la ruta HTTP). Ocultar no cambia `fechaPublicacion` (AC1.7.5); el inmueble deja de
        ser público y se revalida (US0.3).
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserEmail'
      responses:
        '200':
          description: 'Inmueble oculto (PENDIENTE: definición pendiente en TASKS — cuerpo de respuesta no especificado).'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        description: 'PENDIENTE: definición pendiente en TASKS.'
                        properties:
                          id:
                            type: string
                          status:
                            $ref: '#/components/schemas/EstadoPropiedad'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/media/presigned-url:
    post:
      tags: [media]
      operationId: presignMediaUpload
      summary: Firmar una URL PUT presignada en R2 (prefijo `pending/`)
      description: |
        US1.8 / AC1.8.1. Valida el rol (`X-User-Role: admin`) y devuelve una Presigned PUT URL
        que expira en 15 minutos. La clave del objeto la genera el servidor bajo `pending/`
        (`pending/<uuid>.<ext>`); el cliente no elige la ruta (AC1.8.2). Un MIME fuera de
        `image/jpeg`, `image/png` o `image/webp` se rechaza antes de firmar con 422
        `UNSUPPORTED_MEDIA` (AC1.8.3). El navegador solo recibe la URL firmada, nunca
        credenciales de R2 (AC1.8.5).
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, mimeType]
              properties:
                nombre:
                  type: string
                  description: 'Nombre original del archivo (solo se usa para la extensión; la clave la genera el servidor, AC1.8.2).'
                mimeType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                  description: 'Tipo MIME declarado; fuera de esta lista → 422 `UNSUPPORTED_MEDIA` (AC1.8.3).'
      responses:
        '200':
          description: 'URL PUT presignada (vence en 15 min, AC1.8.1).'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        description: 'PENDIENTE: definición pendiente en TASKS (nombres exactos de los campos de respuesta no especificados en US1.8).'
                        properties:
                          url:
                            type: string
                            description: URL PUT presignada hacia R2.
                          key:
                            type: string
                            description: 'Clave generada por el servidor bajo `pending/` (AC1.8.2).'
                          expiresInSeconds:
                            type: integer
                            example: 900
                            description: Validez de la URL presignada en segundos (15 min, AC1.8.1).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/media/confirm:
    post:
      tags: [media]
      operationId: confirmMediaUpload
      summary: Confirmar subida, validar por cabecera y generar derivados WebP
      description: |
        US1.9 / AC1.9.1. El archivo ya está subido a `pending/`; el backend valida por cabecera
        (tipo → peso → dimensiones mínimas → tope de píxeles → proporción, en ese orden,
        AC1.9.6), genera los derivados WebP y elimina el original (AC1.9.1). Códigos:
        `UNSUPPORTED_MEDIA` (contenido no permitido) · `IMAGE_TOO_LARGE` (peso o píxeles) ·
        `IMAGE_TOO_SMALL` (lado mayor < 800 px) · `VALIDATION_ERROR` (clave inexistente o fuera
        de `pending/`, panorámica que no es 2:1). Un fallo de derivados responde 500 `INTERNAL`
        sin dejar derivados parciales y el cliente puede reintentar hasta 3 veces con la misma
        clave (AC1.9.14, AC1.9.15).
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, recurso]
              properties:
                key:
                  type: string
                  description: 'Clave del objeto en `pending/` devuelta por la URL presignada (AC1.9.2).'
                recurso:
                  type: string
                  enum: [foto, panorama]
                  description: 'Destino del archivo: foto o panorámica 360° (AC1.9.1, US4.3.3).'
      responses:
        '200':
          description: Derivados generados; el original se elimina después de guardarlos todos (AC1.9.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        description: 'PENDIENTE: definición pendiente en TASKS (US1.9 dice «las claves de sus derivados» sin nombrar los campos del cuerpo).'
                        properties:
                          derivados:
                            type: array
                            description: Claves de los derivados WebP generados en R2.
                            items:
                              type: object
                              required: [clave, ancho]
                              properties:
                                clave:
                                  type: string
                                ancho:
                                  type: integer
                                  description: 'Lado mayor en px del derivado (320/640/1280/2048 o tamaño completo, US1.9).'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/consignments:
    post:
      tags: [consignments]
      operationId: createConsignment
      summary: Enviar solicitud «Consigne su propiedad» por correo
      description: |
        US3.1–US3.4. Valida la solicitud y envía dos correos vía Resend: uno a Juan Fernando y
        un «Recibo» al solicitante (US3.2). No se persiste ningún dato (D11, AC3.1.7). Defensas:
        campo oculto `sitio` (honeypot) con valor → éxito sin envío (AC3.4.1); 6.º envío en un
        minuto desde la misma IP (`X-Client-IP`) → 429 `RATE_LIMITED` (AC3.4.2). Fallo del
        correo a Juan → 502 `EMAIL_DELIVERY_FAILED` (AC3.2.4). `consent` ausente o falso → 422
        `CONSENT_REQUIRED` sin enviar nada (AC3.3.2).
      parameters:
        - $ref: '#/components/parameters/XClientIP'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsignmentInput'
      responses:
        '200':
          description: Solicitud aceptada y correos enviados (o suprimidos por honeypot, AC3.4.1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        description: 'PENDIENTE: definición pendiente en TASKS (US3.1/US3.2 no especifican el cuerpo de la respuesta de éxito).'
                        properties:
                          enviado:
                            type: boolean
                            description: 'Falso cuando el honeypot `sitio` bloquea el envío (AC3.4.1).'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/EmailDeliveryFailed'
