# CI — los 7 gates de `docs/QA.md` §5.1, en su orden exacto y en un único job
# (el protocolo exige «falla en el primer gate rojo»: un job secuencial lo garantiza;
# jobs paralelos con `needs:` ejecutarían todos los gates aunque el 1 ya esté rojo).
#
# ALCANCE ACTUAL (Fase 0): el gate 5 pasa EN VACÍO a propósito.
#   · 4:   ya hay tests reales en `@jf/client` y `@jf/functions`.
#   · 5:   `@jf/functions` no declara `coverage.thresholds`, así que el «≥ 80 %»
#          de QA §5.1 aún no puede fallar.
#   · 7:   corre `admin-guard.spec.ts`; `placeholder.spec.ts` sigue `test.skip`.
# Verde aquí significa «compila, formatea, tipa y no rompe nada», NO «probado».
# La suite real y los umbrales se cierran en MT6.2 (AC7.2.8, AC7.6.3).
#
# GATE 7 OPT-OUT: si el PR lleva la etiqueta `e2e-skip` o `e2e-omit`, el gate 7
# (y su preparación: cache + Chromium) se omite. Es una decisión explícita del
# autor del PR, no una heurística sobre los archivos cambiados. En push a main y
# en workflow_dispatch (sin PR) el gate siempre se ejecuta.
#
# GATE 8 (E2E CON BACKEND): la suite con tag `@backend` necesita emuladores de
# Firebase (auth, firestore, functions) + seed de catálogo. Se ejecuta solo si
# el PR lleva la etiqueta `e2e-backend` (o en workflow_dispatch), nunca bloquea
# un PR por defecto. Véase job `e2e-backend` al final de este archivo.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  BFF_INTERNAL_KEY: ${{ secrets.BFF_INTERNAL_KEY }}
  SESSION_JWT_SECRET: ${{ secrets.SESSION_JWT_SECRET }}

jobs:
  gates:
    name: Gates pre-PR (QA §5.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24 (según .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # --- Gates 1–7: docs/QA.md §5.1 ------------------------------------
      - name: 'Gate 1/7 · Lint'
        run: npm run lint

      - name: 'Gate 2/7 · Formato (Prettier --check)'
        run: npm run format:check

      - name: 'Gate 3/7 · Tipos (strict)'
        run: npm run typecheck

      - name: 'Gate 4/7 · Tests (unit + integración)'
        run: npm run test

      - name: 'Gate 5/7 · Cobertura backend (objetivo ≥ 80 %, activo en MT6.2)'
        run: npm run test:coverage -w @jf/functions

      - name: 'Gate 6/7 · Build (functions tsc + client next build)'
        run: npm run build

      # Preparación del gate 7 (los navegadores no forman parte del orden de gates).
      - name: Cache de navegadores de Playwright
        if: >-
          github.event_name != 'pull_request'
          || (!contains(github.event.pull_request.labels.*.name, 'e2e-skip')
          && !contains(github.event.pull_request.labels.*.name, 'e2e-omit'))
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Instalar Chromium (Playwright)
        if: >-
          github.event_name != 'pull_request'
          || (!contains(github.event.pull_request.labels.*.name, 'e2e-skip')
          && !contains(github.event.pull_request.labels.*.name, 'e2e-omit'))
        run: npx playwright install --with-deps chromium
        working-directory: packages/client

      - name: 'Gate 7/7 · E2E móvil (Playwright + axe)'
        if: >-
          github.event_name != 'pull_request'
          || (!contains(github.event.pull_request.labels.*.name, 'e2e-skip')
          && !contains(github.event.pull_request.labels.*.name, 'e2e-omit'))
        working-directory: packages/client
        run: npm run test:e2e

  # --- Gate 8: E2E con backend real (emuladores + seed) ------------------
  # Solo corre si el PR lleva la etiqueta `e2e-backend`; nunca bloquea el gate 7.
  e2e-backend:
    name: Gate 8 · E2E con backend (emuladores + seed)
    needs: gates
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'e2e-backend'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BFF_INTERNAL_KEY: ci-e2e-backend-internal-key-000000000000
      SESSION_JWT_SECRET: ci-e2e-backend-session-secret-000000000000
      FUNCTIONS_BASE_URL: http://127.0.0.1:5001/jf-propiedad-raiz/us-central1
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24 (según .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Java 21 (emulador de Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache de navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium
        working-directory: packages/client

      - name: Build de Cloud Functions (emulador de Functions)
        run: npm run build -w @jf/functions

      - name: Variables de entorno de Functions para los emuladores
        run: |
          printf 'BFF_INTERNAL_KEY=%s\nSESSION_JWT_SECRET=%s\n' "$BFF_INTERNAL_KEY" "$SESSION_JWT_SECRET" > packages/functions/.env.local

      - name: 'Gate 8/8 · E2E con backend (emuladores + seed)'
        run: >-
          npx -y firebase-tools@latest emulators:exec
          --project=jf-propiedad-raiz
          --only auth,firestore,functions
          "npm run seed:catalog && npm run test:e2e:backend"

      - name: Subir artefactos de E2E si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-report-${{ github.run_attempt }}
          path: |
            packages/client/test-results
            packages/client/playwright-report
